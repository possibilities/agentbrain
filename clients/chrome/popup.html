<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agentbrain shares</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.45 system-ui, sans-serif;
        margin: 0;
        width: 360px;
        max-height: 520px;
        overflow-y: auto;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.3);
        position: sticky;
        top: 0;
        background: Canvas;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.primary { background: #1b7f4b; border-color: #1b7f4b; color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      .spacer { flex: 1; }
      .icon { padding: 6px 8px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.18);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 2px 8px;
      }
      .title {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .where {
        grid-column: 1 / 3;
        color: rgba(128, 128, 128, 1);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .detail { grid-column: 1 / -1; font-size: 11px; color: rgba(128, 128, 128, 1); }
      .chip {
        grid-row: 1;
        grid-column: 2;
        align-self: start;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        white-space: nowrap;
        border: 1px solid currentColor;
      }
      button.remove {
        grid-row: 1 / span 2;
        grid-column: 3;
        align-self: center;
        padding: 2px 7px;
        font-size: 11px;
      }
      .chip.held { color: #b45309; }
      .chip.sent { color: #1b7f4b; }
      .chip.working { color: #2563eb; }
      .chip.indexed { color: #1b7f4b; }
      .chip.problem { color: #a32020; }
      .chip.muted { color: #6b6b6b; }
      footer {
        padding: 10px 12px;
        border-top: 1px solid rgba(128, 128, 128, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(128, 128, 128, 1);
        font-size: 11px;
        position: sticky;
        bottom: 0;
        background: Canvas;
      }
      .empty { padding: 24px 12px; text-align: center; color: rgba(128, 128, 128, 1); }
    </style>
  </head>
  <body>
    <header>
      <button type="button" id="share" class="primary">Send this page</button>
      <span class="spacer"></span>
      <button type="button" id="flush" class="icon" title="Try holding shares now">Send held</button>
      <button type="button" id="options" class="icon" title="Options">⚙</button>
    </header>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>Nothing shared yet.</div>
    <footer>
      <span id="status">Loading…</span>
      <span class="spacer"></span>
      <button type="button" id="clear" class="icon">Clear list</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
